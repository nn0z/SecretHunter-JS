[settings]
validate_secrets = no
i_have_authorization = no
no_cache = no
verify_ssl = no
restrict_to_target_domain = yes
enable_common_paths_scan = yes
enable_graphql_introspection = yes
enable_cors_check = yes
probe_firebase_db = no
i_have_authorization_firebase = no
enable_binary_scan = yes
max_download_mb = 5
rate_limit_per_second = 5
max_workers = 15
